[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencebound-tradegate"
version = "1.0.0"
description = "KACHING! proof-carrying financial action firewall for Binance Agent OS"
requires-python = ">=3.11"
dependencies = ["cryptography>=45"]

[project.scripts]
tradegate = "tradegate.cli:main"
kaching = "tradegate.web:main"

[tool.setuptools.packages.find]
include = ["tradegate*"]
